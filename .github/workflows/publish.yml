# Build and push container images for the three runnable services
# (backend, frontend, ibkr-sidecar) to GitHub Container Registry whenever a
# commit lands on main. PRs do NOT push — they're already gated by ci.yml
# (lint + build), tests.yml (dotnet test, pytest, jest), and security.yml
# (gitleaks + dependency audits) on the same trigger.
#
# Tags applied to each image (via docker/metadata-action):
#   - latest        — always tracks the tip of main
#   - sha-<short>   — 7-char commit SHA, for unambiguous redeploys & rollback
#
# Auth uses the per-run GITHUB_TOKEN with `packages: write` — no extra secret
# needed. GHCR scope is granted implicitly by the workflow-level permissions.
#
# Build cache is persisted via the GitHub Actions cache backend
# (type=gha, scoped per matrix component) so subsequent runs reuse layers.
# The matrix runs all three components in parallel with fail-fast off so a
# failure in one image doesn't cancel publishes of the others.
#
# Each image is built into the local Docker daemon, scanned by Trivy, and only
# then pushed — a failing scan blocks publication of that component (the others
# still publish). See the scan step for why the gate is scoped to CRITICAL.
name: Publish images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# A newer push to main supersedes in-flight runs. Cancelling is safe here —
# each run fully replaces the `latest` tag, so the most recent push wins anyway.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
          - component: ibkr-sidecar
            context: ./ibkr-sidecar
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase. ${{ github.repository }} preserves
      # owner+repo casing (e.g. "pss1u19/CheapAnalysisApp"), so lowercase it
      # once via bash parameter expansion and reuse via $GITHUB_ENV.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      # Build into the local Docker daemon (load, no push yet) so Trivy scans the
      # exact artifact that will be published. The build cache is still written to
      # the Actions backend for the next run. load:true is single-platform, which
      # matches this workflow — no multi-arch build is configured.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Vulnerability-gate the built image before it reaches GHCR. Scoped to
      # CRITICAL with ignore-unfixed: the highest-severity, actually-patchable
      # issues block the publish, while unfixable base-image CVEs (no upstream
      # patch yet) don't wedge the pipeline. HIGH/below and language-level
      # coverage is layered in security.yml (dotnet list --vulnerable, pnpm audit
      # --prod) plus Dependabot. Worth tightening to CRITICAL,HIGH once the
      # frontend ships a prod (nginx) image and its build toolchain — which
      # carries known fixable HIGH advisories (see security.yml) — leaves the
      # published layer.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      # Trivy passed — push every tag (latest + sha-<short>) of the scanned image.
      - name: Push image
        run: docker image push --all-tags ${{ env.IMAGE }}
