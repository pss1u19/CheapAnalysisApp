# Gates every pull request behind the Contributor License Agreement (CLA.md).
# On each PR (and on the "I hereby sign" comment) the CLA Assistant checks the
# author against recorded signatures and posts a status + comment. Signatures are
# stored as JSON on a dedicated `cla-signatures` branch in this repo, so the
# record lives with the project and survives forks/clones.
#
# REQUIRED SECRET: CLA_SIGNATURES_TOKEN — a fine-grained or classic PAT with
#   Contents: read/write on this repo. The default GITHUB_TOKEN cannot push the
#   signature commit to the storage branch, so the action needs its own token.
#   Create it at Settings > Developer settings > Personal access tokens, then add
#   it under repo Settings > Secrets and variables > Actions.
#
# The Owner (pss1u19) and dependency bots are allow-listed and never asked to sign.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

# pull_request_target runs in the base-repo context, so these permissions apply
# to the trusted repo (not the fork) — required for the bot to comment, set the
# PR status, and store signatures.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    # Only run on the signing comment or on real PR events — ignore unrelated
    # issue comments so the job doesn't fire on every issue thread.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          # The exact sentence a contributor must comment to sign.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          # Where signatures are stored, and where the CLA text lives.
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/pss1u19/CheapAnalysisApp/blob/main/CLA.md'
          branch: 'cla-signatures'
          # Accounts that never need to sign: the Owner plus dependency bots.
          allowlist: 'pss1u19,dependabot[bot],renovate[bot]'
