<main class="min-h-screen bg-background text-foreground">
  <header class="border-b border-border px-6 py-4">
    <h1 class="text-2xl font-semibold tracking-tight">{{ title }}</h1>
    <p class="text-sm text-muted-foreground">Bulgaria-first personal finance dashboard</p>
  </header>

  <section class="p-6">
    <div [class]="cardClass">
      <p class="mb-4 text-sm text-muted-foreground">
        Frontend tooling is wired up: Tailwind CSS, Angular Material, and spartan-ng.
      </p>
      <button mat-raised-button color="primary">Get started</button>
      <brn-separator class="my-4 block h-px w-full bg-border"></brn-separator>
      <p class="text-xs text-muted-foreground">spartan-ng brain primitives are available.</p>
    </div>
  </section>

  <router-outlet />
</main>
